{% load static %}
<!doctype html>
<html lang="en" data-accent="{{ active_team.accent_color|default:'blue' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prep App</title>
  <script>
    // Applied before first paint to avoid a flash of the wrong theme.
    // Bootstrap only switches to dark via an explicit data-bs-theme
    // attribute — it doesn't read prefers-color-scheme on its own — so an
    // unset preference is resolved against the OS setting right here,
    // once, rather than left on Bootstrap's light default.
    (function () {
      try {
        var saved = localStorage.getItem("prepapp:theme");
        var theme = saved === "light" || saved === "dark"
          ? saved
          : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-bs-theme", theme);
      } catch (e) {}
    })();
  </script>

  <!-- Bootstrap -->
  <link href="{% static 'vendor/bootstrap/bootstrap.min.css' %}" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="{% static 'vendor/bootstrap-icons/bootstrap-icons.min.css' %}" rel="stylesheet">
  <!-- HTMX -->
  <script src="{% static 'vendor/htmx/htmx.min.js' %}"></script>

  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  {% include "includes/navbar.html" %}
  {% include "includes/messages.html" %}
  {% include "includes/confirm_modal.html" %}

  <main>
    {% block content %}{% endblock %}
  </main>

  <script src="{% static 'vendor/bootstrap/bootstrap.bundle.min.js' %}"></script>
  <script src="{% static 'js/app.js' %}"></script>
</body>
</html>
