{% extends "base.html" %}
{% block content %}
<div class="container prep-shell py-3 py-md-4">
  <h2>Create Workspace</h2>

  <form method="post" class="card prep-card card-body mt-3">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label">Team name</label>
      {{ form.name }}
    </div>
    <div class="prep-actions">
      <button class="btn btn-primary" type="submit">Create</button>
      <a class="btn btn-outline-secondary" href="{% url 'accounts:team_start' %}">Back</a>
    </div>
  </form>
</div>
{% endblock %}
