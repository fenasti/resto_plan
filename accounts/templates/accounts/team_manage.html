{% extends "base.html" %}
{% block content %}
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center">
    <div>
      <h2>Manage Team</h2>
      <div class="text-muted">{{ team.name }}</div>
    </div>
  </div>

  <div class="card card-body mt-3">
    <div class="d-flex justify-content-between align-items-center">
      <div>
        <strong>Join code:</strong> <span class="badge text-bg-dark">{{ team.join_code }}</span>
      </div>
      <form method="post">
        {% csrf_token %}
        <input type="hidden" name="action" value="rotate_code">
        <button class="btn btn-outline-secondary" type="submit">Rotate Code</button>
      </form>
    </div>
  </div>

  <h5 class="mt-4">Members</h5>
  <div class="table-responsive">
    <table class="table align-middle">
      <thead>
        <tr>
          <th>User</th>
          <th>Role</th>
          <th>Menu</th>
          <th>Recipes</th>
          <th>Team</th>
          <th>Update</th>
        </tr>
      </thead>
      <tbody>
        {% for m in memberships %}
        <tr>
          <td>{{ m.user.username }}</td>
          <td>
            <form method="post" class="d-flex gap-2 align-items-center">
              {% csrf_token %}
              <input type="hidden" name="action" value="update_member">
              <input type="hidden" name="membership_id" value="{{ m.id }}">
              <select class="form-select" name="role" style="max-width:160px;">
                <option value="OWNER" {% if m.role == "OWNER" %}selected{% endif %}>OWNER</option>
                <option value="ADMIN" {% if m.role == "ADMIN" %}selected{% endif %}>ADMIN</option>
                <option value="MEMBER" {% if m.role == "MEMBER" %}selected{% endif %}>MEMBER</option>
              </select>
          </td>
          <td><input class="form-check-input" type="checkbox" name="can_manage_menu" {% if m.can_manage_menu %}checked{% endif %}></td>
          <td><input class="form-check-input" type="checkbox" name="can_manage_recipes" {% if m.can_manage_recipes %}checked{% endif %}></td>
          <td><input class="form-check-input" type="checkbox" name="can_manage_team" {% if m.can_manage_team %}checked{% endif %}></td>
          <td>
              <button class="btn btn-sm btn-primary" type="submit">Save</button>
            </form>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
