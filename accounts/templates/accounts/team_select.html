{% extends "base.html" %}
{% block content %}
<div class="container py-4">
  <h2>Select Workspace</h2>

  <form method="post" class="card card-body mt-3">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label">Choose team</label>
      {{ form.team_id }}
    </div>
    <button class="btn btn-primary" type="submit">Select</button>
    <a class="btn btn-link" href="{% url 'accounts:team_join' %}">Join with code</a>
    {% if request.user.is_staff %}
      <a class="btn btn-link" href="{% url 'accounts:team_create' %}">Create team</a>
    {% endif %}
  </form>
</div>
{% endblock %}
