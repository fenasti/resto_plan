{% extends "base.html" %}
{% block content %}
<div class="container prep-shell py-3 py-md-4">
  <h2>Select Workspace</h2>

  <form method="post" class="card prep-card card-body mt-3">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label">Choose team</label>
      {{ form.team_id }}
    </div>
    <div class="prep-actions">
      <button class="btn btn-primary" type="submit">Select</button>
      <a class="btn btn-outline-secondary" href="{% url 'accounts:team_join' %}">Join with code</a>
      <a class="btn btn-outline-secondary" href="{% url 'accounts:team_create' %}">Create team</a>
    </div>
  </form>
</div>
{% endblock %}
