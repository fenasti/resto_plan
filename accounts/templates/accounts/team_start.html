{% extends "base.html" %}
{% block content %}
<div class="container prep-shell py-3 py-md-4">
  <div class="card prep-card shadow-sm">
    <div class="card-body">
      <h2 class="mb-2">Get Started With Your Team</h2>
      <p class="text-muted mb-0">Create a new workspace for your restaurant, or join an existing team with a code.</p>

      <div class="prep-actions mt-4">
        <a class="btn btn-primary" href="{% url 'accounts:team_create' %}">Create a New Team</a>
        <a class="btn btn-outline-secondary" href="{% url 'accounts:team_join' %}">Join an Existing Team</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
