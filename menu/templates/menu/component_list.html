{% extends "base.html" %}
{% block content %}
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center">
    <h2>Components</h2>
    <a class="btn btn-primary" href="{% url 'menu:component_create' %}">Create Component</a>
  </div>

  <div class="mt-3">
    {% for c in components %}
      <div class="card mb-2">
        <div class="card-body d-flex justify-content-between align-items-center">
          <div>
            <strong>{{ c.name }}</strong>
            <span class="badge text-bg-light ms-2">{{ c.type }}</span>
            {% if c.recipe_id %}
              <a class="ms-2 text-decoration-none" href="{% url 'menu:recipe_detail' c.recipe_id %}">
                <i class="bi bi-journal-text"></i>
              </a>
            {% endif %}
          </div>
          <div class="d-flex gap-2">
            <a class="btn btn-sm btn-outline-primary" href="{% url 'menu:component_edit' c.pk %}">Edit</a>
            <a class="btn btn-sm btn-outline-danger" href="{% url 'menu:component_delete' c.pk %}">Delete</a>
          </div>
        </div>
      </div>
    {% empty %}
      <p>No components yet.</p>
    {% endfor %}
  </div>
</div>
{% endblock %}
