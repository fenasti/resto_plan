{% extends "base.html" %}
{% block content %}
<div class="container py-4">
  <h2>{% if view.object %}Edit Component{% else %}Create Component{% endif %}</h2>
  <form method="post" class="card card-body mt-3">
    {% csrf_token %}
    <div class="mb-3"><label class="form-label">Name</label>{{ form.name }}</div>
    <div class="mb-3"><label class="form-label">Type</label>{{ form.type }}</div>
    <div class="mb-3"><label class="form-label">Spec</label>{{ form.spec_text }}</div>
    <div class="mb-3"><label class="form-label">Recipe (optional)</label>{{ form.recipe }}</div>
    <button class="btn btn-primary" type="submit">Save</button>
  </form>
</div>
{% endblock %}
